[project]
name = "ppt-deepagent"
version = "0.1.0"
requires-python = ">=3.13,<3.15"

dependencies = [
    "deepagents==0.7.0",
    "langgraph==1.2.11",
    "langchain==1.3.15",
    "langchain-openai==1.5.1",
    "langchain-deepseek==1.1.0",
    "langchain-quickjs==0.3.5",
    "langsmith[sandbox]==0.11.0",
    "pydantic-settings==2.15.0",
    "langchain-daytona>=0.0.8",
    "boto3>=1.43.75",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
extend-exclude = ["agent/skills/pptx"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.31",
    "langgraph-sdk==0.4.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.3",
]
