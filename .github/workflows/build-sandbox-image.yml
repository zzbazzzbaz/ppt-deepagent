name: Build Sandbox Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (e.g. v1)"
        required: true
        default: "v1"
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build context
        run: |
          mkdir -p /tmp/sandbox-context
          cp sandbox/Dockerfile sandbox/package.json sandbox/package-lock.json sandbox/requirements.txt /tmp/sandbox-context/
          cp -r agent/skills/pptx /tmp/sandbox-context/pptx
          ls -la /tmp/sandbox-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: /tmp/sandbox-context
          file: /tmp/sandbox-context/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max