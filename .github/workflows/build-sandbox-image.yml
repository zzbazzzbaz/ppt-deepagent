name: Build Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - "agent/skills/pptx/**"
      - ".github/workflows/build-sandbox-image.yml"
      - "scripts/sandbox_snapshot.py"
  workflow_dispatch:

concurrency:
  group: ppt-deepagent-sandbox-snapshot-sync
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate image metadata
        id: metadata
        shell: bash
        run: |
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          echo "timestamp=${timestamp}" >> "$GITHUB_OUTPUT"

      - name: Prepare build context
        run: |
          mkdir -p /tmp/sandbox-context/agent/skills
          cp sandbox/Dockerfile sandbox/package.json sandbox/package-lock.json sandbox/requirements.txt /tmp/sandbox-context/
          cp -R agent/skills/pptx /tmp/sandbox-context/agent/skills/pptx
          printf '__pycache__/\n*.py[cod]\n.DS_Store\n' > /tmp/sandbox-context/.dockerignore
          ls -la /tmp/sandbox-context /tmp/sandbox-context/agent/skills/pptx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: /tmp/sandbox-context
          file: /tmp/sandbox-context/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ppt-deepagent-sandbox-${{ steps.metadata.outputs.timestamp }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ppt-deepagent-sandbox-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Synchronize LangSmith snapshot
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          uv run --frozen python -m scripts.sandbox_snapshot sync-image \
            --name ppt-deepagent-sandbox-latest \
            --candidate-name ppt-deepagent-sandbox-candidate-${{ steps.metadata.outputs.timestamp }} \
            --docker-image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ppt-deepagent-sandbox-${{ steps.metadata.outputs.timestamp }}" \
            --image-digest "${{ steps.build.outputs.digest }}"
